    color-scheme: dark;

  }

  --s1: #4f95ea; --s2: #f0953a; --s3: #2bbfa2; --s4: #a77cf0; --s5: #e06a9e; --s6: #b5c444; --s7: #4fb3e8; --s8: #f2766b; --s9: #c9ad83; --s10: #4cc98a; --s11: #f5b04c; --s12: #b9a2f2; --s13: #f07fb5; --s14: #7fc4d9; --s15: #a9d36b; --s16: #e8907f; --s17: #9a9af0; --s18: #9ca3af; --s19: #67c7dc; --s20: #e0b04a; --shadow: none; --bar-bg: rgba(13,13,13,0.8);

* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--page); color: var(--ink); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
  -webkit-text-size-adjust: 100%; -webkit-font-smoothing: antialiased; }

  -webkit-backdrop-filter: saturate(160%) blur(14px); border-bottom: 1px solid var(--border); padding-top: env(safe-area-inset-top); }

  display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; }

  border-radius: 999px; padding: 5px 12px 5px 10px; white-space: nowrap; }
.live strong { color: var(--ink); font-weight: 600; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex: none; }
.dot.on { background: var(--good); }
.icon-btn { width: 34px; height: 34px; border-radius: 10px; border: 1px solid var(--border); background: transparent; cursor: pointer; display: grid; place-items: center; font-size: 18px; line-height: 1; }
.standing { display: grid; grid-template-columns: minmax(0, 1fr) auto auto auto; font-variant-numeric: tabular-nums; margin-top: 8px; }
.standing > div { padding: 9px 0; border-bottom: 1px solid var(--grid); }
.standing .h { color: var(--muted); font-size: 12px; padding-top: 0; }
.standing .r { text-align: right; padding-left: 14px; white-space: nowrap; }
.standing .nm { display: flex; align-items: center; gap: 8px; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.standing .nm span { overflow: hidden; text-overflow: ellipsis; }
.standing .nm i { width: 10px; height: 10px; border-radius: 3px; background: var(--c); flex: none; }
.standing .ret { font-weight: 700; }
.speed { display: grid; grid-template-columns: minmax(0, 1fr) repeat(5, auto); font-variant-numeric: tabular-nums; margin-top: 10px; }
.speed > div { padding: 9px 0; border-bottom: 1px solid var(--grid); min-width: 0; }
.speed .h { color: var(--muted); font-size: 12px; padding-top: 0; }

.list { display: grid; margin-top: 8px; font-variant-numeric: tabular-nums; }

footer { color: var(--muted); font-size: 12px; margin-top: 22px; }
.stale main { opacity: 0.55; }

<script>
"use strict";
const $ = (id) => document.getElementById(id);
const SVG = "http://www.w3.org/2000/svg";
const nf = (d) => new Intl.NumberFormat("da-DK", { minimumFractionDigits: d, maximumFractionDigits: d });
const pct = (x, d = 2) => (x == null ? "–" : (x > 0 ? "+" : x < 0 ? "−" : "") + nf(d).format(Math.abs(x)) + " %");
const share = (x, d = 0) => (x == null ? "–" : nf(d).format(x) + " %");
const cls = (x) => (x > 0.0005 ? "up" : x < -0.0005 ? "down" : "");
const pad = (n) => String(n).padStart(2, "0");
const MONTHS = ["jan.", "feb.", "mar.", "apr.", "maj", "jun.", "jul.", "aug.", "sep.", "okt.", "nov.", "dec."];
const when = (ts) => { const d = new Date(ts * 1000); return d.getDate() + ". " + MONTHS[d.getMonth()] + " kl. " + pad(d.getHours()) + ":" + pad(d.getMinutes()); };
const REASONS = { stop_loss: "stop", trailing_stop: "trailing", stale_price: "ingen kurs", take_profit: "gevinstmål", time_stop: "tidsgrænse" };
function h(tag, props, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (v == null || v === false) continue;
    if (k === "text") el.textContent = v; else if (k === "style") el.style.cssText = v; else el.setAttribute(k, v);
  }
  for (const k of kids.flat()) if (k != null && k !== false) el.append(k);
  return el;
}
function s(tag, attrs) { const el = document.createElementNS(SVG, tag); for (const [k, v] of Object.entries(attrs)) el.setAttribute(k, v); return el; }
const color = (i) => "var(--s" + (i + 1) + ")";

function bookCard(b, i, leader) {
  const fact = (k, v, c) => h("div", { class: "fact" }, h("div", { class: "k", text: k }), h("div", { class: "v " + (c || ""), text: v }));
  return h("section", { class: "card book", style: "--c:" + color(i) },
    h("div", { class: "head" }, h("span", { class: "num", text: "Strategi " + (i + 1) }), leader && h("span", { class: "best", text: "Fører" })),
    h("h2", { text: b.name }),
    h("div", { class: "big " + cls(b.return_pct), text: pct(b.return_pct) }),
    h("div", { class: "note", text: "afkast siden start" }),
    h("div", { class: "facts" },
      fact("Lukkede handler", nf(0).format(b.closed)),
      fact("Vundne", b.win_rate == null ? "–" : share(b.win_rate) + " (" + b.wins + ")"),
      fact("Gns. pr. handel", pct(b.avg_pct, 1), cls(b.avg_pct || 0)),
      fact("Største fald", pct(b.max_drawdown_pct, 2), cls(b.max_drawdown_pct)),
      fact("Åbne lige nu", nf(0).format(b.open.length) + (b.open.length ? " · " + share(b.invested_pct, 1) + " investeret" : "")),
      fact("Bedste / værste", b.best_pct == null ? "–" : pct(b.best_pct, 1) + " / " + pct(b.worst_pct, 1))),
    (b.open.length || b.recent.length) ? h("div", { class: "list" },
      b.open.map((p) => h("div", null, h("span", { text: p.symbol + " · score " + nf(0).format(p.score) }),
        h("span", { class: "muted", text: "åben" + (p.trail_active ? ", trailing" : "") }), h("span", { class: cls(p.unrealized_pct), text: pct(p.unrealized_pct, 1) }))),
      b.recent.map((t) => h("div", null, h("span", { text: t.symbol + " · score " + nf(0).format(t.score) }),
        h("span", { class: "muted", text: REASONS[t.reason] || t.reason }), h("span", { class: cls(t.pnl_pct), text: pct(t.pnl_pct, 1) })))) : null,
    h("details", null, h("summary", { text: "Regler" }),
      h("div", { class: "rules" }, b.rules.map(([agent, lines]) => h("div", null, h("b", { text: agent }), h("ul", null, lines.map((l) => h("li", { text: l }))))))));
}

// Smooth line through the points: monotone cubic (Fritsch-Carlson), so the curve never
// overshoots above a peak or below a dip that the data does not contain.
function smoothPath(pts) {
  const f = (v) => v.toFixed(1);
  const p = pts.filter((q, i) => i === 0 || q[0] > pts[i - 1][0]);       // x must increase
  const n = p.length;
  if (n === 0) return "";
  if (n < 3) return "M" + p.map((q) => f(q[0]) + "," + f(q[1])).join("L");
  const dx = [], sl = [];
  for (let i = 0; i < n - 1; i++) { dx.push(p[i + 1][0] - p[i][0]); sl.push((p[i + 1][1] - p[i][1]) / dx[i]); }
  const m = [sl[0]];
  for (let i = 1; i < n - 1; i++) m.push(sl[i - 1] * sl[i] <= 0 ? 0 : (sl[i - 1] + sl[i]) / 2);
  m.push(sl[n - 2]);
  for (let i = 0; i < n - 1; i++) {
    if (sl[i] === 0) { m[i] = 0; m[i + 1] = 0; continue; }
    const a = m[i] / sl[i], b = m[i + 1] / sl[i], r = a * a + b * b;
    if (r > 9) { const t = 3 / Math.sqrt(r); m[i] = t * a * sl[i]; m[i + 1] = t * b * sl[i]; }
  }
  let d = "M" + f(p[0][0]) + "," + f(p[0][1]);
  for (let i = 0; i < n - 1; i++) {
    const h3 = dx[i] / 3;
    d += "C" + f(p[i][0] + h3) + "," + f(p[i][1] + m[i] * h3) + " " + f(p[i + 1][0] - h3) + "," + f(p[i + 1][1] - m[i + 1] * h3) + " " + f(p[i + 1][0]) + "," + f(p[i + 1][1]);
  }
  return d;
}

function chartCard(st) {
  const box = h("div", { class: "chart", role: "img", "aria-label": "Afkast over tid for strategierne" });
  const draw = () => {
    box.replaceChildren();
    const W = box.clientWidth || 600, H = box.clientHeight || 260, L = 46, R = 10, T = 10, B = 24;
    const all = st.books.flatMap((b) => b.curve);
    if (all.length < 2) { box.append(h("div", { class: "empty", text: "Kurven kommer, når strategierne har kørt lidt." })); return; }
    const t0 = st.start_ts, t1 = Math.max(...all.map((p) => p[0]), t0 + 60);
    let lo = Math.min(0, ...all.map((p) => p[1])), hi = Math.max(0, ...all.map((p) => p[1]));
    if (hi - lo < 0.5) { hi += 0.25; lo -= 0.25; }
    const pad_ = (hi - lo) * 0.08; lo -= pad_; hi += pad_;
    const x = (t) => L + (t - t0) / (t1 - t0) * (W - L - R), y = (v) => T + (hi - v) / (hi - lo) * (H - T - B);
    const svg = s("svg", { viewBox: `0 0 ${W} ${H}` });
    const step = Math.pow(10, Math.floor(Math.log10((hi - lo) / 4)));
    const nice = [1, 2, 5, 10].map((m) => m * step).find((m) => (hi - lo) / m <= 6) || step * 10;
    for (let v = Math.ceil(lo / nice) * nice; v <= hi; v += nice) {
      svg.append(s("line", { x1: L, x2: W - R, y1: y(v), y2: y(v), stroke: Math.abs(v) < nice / 2 ? "var(--axis)" : "var(--grid)", "stroke-width": 1 }));
      const lab = s("text", { x: L - 6, y: y(v) + 4, "text-anchor": "end" }); lab.textContent = pct(v, nice < 1 ? 1 : 0); svg.append(lab);
    }
    [t0, (t0 + t1) / 2, t1].forEach((t, i) => {
      const d = new Date(t * 1000), lab = s("text", { x: x(t), y: H - 6, "text-anchor": ["start", "middle", "end"][i] });
      lab.textContent = d.getDate() + "/" + (d.getMonth() + 1) + " " + pad(d.getHours()) + ":" + pad(d.getMinutes()); svg.append(lab);
    });
    st.books.forEach((b, i) => {
      if (b.curve.length < 1) return;
      svg.append(s("path", { d: smoothPath(b.curve.map((p) => [x(p[0]), y(p[1])])), fill: "none", stroke: color(i), "stroke-width": 2, "stroke-linejoin": "round", "stroke-linecap": "round" }));
    });
    box.append(svg);
  };
  box._draw = draw;
  return h("section", { class: "card", style: "margin-bottom:16px" },
    h("h2", { text: "Afkast over tid" }),
    h("p", { class: "sub", text: "Alle startede " + when(st.start_ts) + " med hver sin virtuelle konto." }),
    h("div", { class: "legend" }, st.books.map((b, i) => h("span", { style: "--c:" + color(i) }, h("i"), (i + 1) + ". " + b.name))),
    box);
}

let speedSpan = "day";
function duration(sec) {
  if (sec == null) return "–";
  if (sec < 60) return Math.round(sec) + " sek.";
  if (sec < 3600) return Math.round(sec / 60) + " min.";
  const hh = Math.floor(sec / 3600), mm = Math.round((sec % 3600) / 60);
  return hh + " t." + (mm ? " " + mm + " min." : "");
}
function speedCard(st) {
  const sp = st.speed && st.speed[speedSpan];
  if (!sp) return null;
  const n0 = (v) => (v == null ? "–" : nf(0).format(v));
  const rows = [
    ["I vinduet pr. runde", (b) => (sp.books[b.key].window_avg == null ? "–" : nf(1).format(sp.books[b.key].window_avg))],
    ["Coins vurderet", (b) => n0(sp.books[b.key].scored)],
    ["Opfyldte reglerne", (b) => n0(sp.books[b.key].qualified)],
    ["Købt", (b) => n0(sp.books[b.key].bought)],
    ["Gns. handelstid", (b) => duration(b.avg_hold_s)],
  ];
  const seg = h("div", { class: "seg", role: "group", "aria-label": "Periode" },
    [["hour", "Seneste time"], ["day", "Seneste døgn"]].map(([k, label]) => {
      const btn = h("button", { type: "button", "aria-pressed": String(k === speedSpan), text: label });
      btn.addEventListener("click", () => { speedSpan = k; lastKey = ""; tick(); });
      return btn;
    }));
  const every = st.mark_every_s;
  return h("section", { class: "card", style: "margin-bottom:16px" },
    h("div", { class: "card-head" },
      h("div", null, h("h2", { text: "Hastighed" }),
        h("p", { class: "sub", text: "Fælles for alle: " + n0(sp.rounds) + " scanningsrunder, i gns. "
          + (sp.round_avg_s == null ? "–" : nf(0).format(sp.round_avg_s) + " sek.") + " pr. runde. Kursen på strategiernes positioner tjekkes "
          + (every == null ? "hvert 2. sek." : "hvert " + nf(1).format(every) + ". sek. (målt).") })),
      seg),
    h("div", { class: "speed" },
      ["Strategi", "Vindue", "Vurd.", "Opfyldt", "Købt", "Tid"].map((x, k) => h("div", { class: "h" + (k ? " r" : ""), text: x })),
      st.books.flatMap((b, i) => [
        h("div", { class: "hc", style: "--c:" + color(i), text: (i + 1) + ". " + b.name.replace(" regler", "").replace("Bredt vindue", "Bredt").replace("Længere trailing", "Længere").replace("Dybe pools", "Dybe").replace("Hurtig gevinst", "Hurtig").replace("Mange små", "Små") }),
        ...rows.map(([, f]) => h("div", { class: "r", text: f(b) }))])),
    h("p", { class: "sub", style: "margin-top:10px", text: "Vindue: coins i vinduet pr. runde (gns.). Vurd.: forskellige coins, der fik en score. Opfyldt: havde høj nok score, LP og likviditet. Købt: handler taget. Tid: gennemsnitlig tid i en handel." }));
}

let lastKey = "";
function render(state) {
  const st = state.strategies, status = state.status || {};
  $("status").replaceChildren(h("span", { class: "dot" + (status.running ? " on" : "") }),
    h("strong", { text: status.running ? "Kører" : "Stoppet" }));
  const key = JSON.stringify({ st, running: status.running, speedSpan });
  if (key === lastKey) return;
  lastKey = key;
  const main = $("main");
  if (!st || !st.books || !st.books.length) {
    main.replaceChildren(h("section", { class: "card" }, h("div", { class: "empty", text: "Strategitesten starter, når desken kører den nye version." })));
    return;
  }
  const lead = st.books.some((b) => b.closed + b.open.length > 0) ? st.books.reduce((a, b) => (b.return_pct > a.return_pct ? b : a)).key : null;
  const ranked = st.books.map((b, i) => ({ b, i })).sort((x, y) => y.b.return_pct - x.b.return_pct);
  const standing = h("section", { class: "card", style: "margin-bottom:16px" },
    h("h2", { text: "Stilling" }),
    h("div", { class: "standing" },
      ["Strategi", "Afkast", "Lukket", "Vundne"].map((x, k) => h("div", { class: "h" + (k ? " r" : ""), text: x })),
      ranked.flatMap(({ b, i }) => [
        h("div", { class: "nm", style: "--c:" + color(i) }, h("i"), h("span", { text: (i + 1) + ". " + b.name.replace(" regler", "") })),
        h("div", { class: "r ret " + cls(b.return_pct), text: pct(b.return_pct) }),
        h("div", { class: "r", text: nf(0).format(b.closed) }),
        h("div", { class: "r", text: b.win_rate == null ? "–" : share(b.win_rate) })])));
  main.replaceChildren(
    standing,
    h("div", { class: "books" }, st.books.map((b, i) => bookCard(b, i, b.key === lead))),
    chartCard(st),
    speedCard(st),
    h("section", { class: "card" },
      h("h2", { text: "Sådan måles det" }),
      h("p", { class: "sub", text: "Alle strategier får de samme coins og måles ens: købet sker til en rigtig Jupiter-quote af strategiens egen ordrestørrelse, stop og trailing følges på hver kurs, og salget er et estimat (kursen minus den prisvirkning, købet betalte). Afkast er i procent af hver strategis startkonto. Under 20–30 lukkede handler pr. strategi er forskellene mest tilfældigheder." }),
      st.real_since_pct != null && h("p", { class: "sub", text: "Den rigtige papirkonto (strategi 2's regler med rigtige salgs-quotes) har i samme periode givet " + pct(st.real_since_pct) + "." })));
  document.querySelectorAll(".chart").forEach((el) => el._draw && el._draw());
  $("foot").textContent = "Papirhandel: ingen rigtige penge er i spil. Siden opdaterer sig selv hvert 5. sekund.";
}

function applyTheme(t) { if (t === "dark" || t === "light") document.documentElement.dataset.theme = t; }
const isDark = () => { const t = document.documentElement.dataset.theme; return t ? t === "dark" : matchMedia("(prefers-color-scheme: dark)").matches; };
try { applyTheme(localStorage.getItem("desk-theme")); } catch (e) { /* no storage: follow the system */ }
$("theme").addEventListener("click", () => {
  const next = isDark() ? "light" : "dark";
  try { localStorage.setItem("desk-theme", next); } catch (e) { /* not remembered */ }
  applyTheme(next); lastKey = ""; tick();
});

async function tick() {
  let state;
  try {
    const res = await fetch("api/state", { cache: "no-store" });
    if (!res.ok) throw new Error(res.status);
    state = await res.json();
  } catch (e) {
    document.body.classList.add("stale");
    $("status").replaceChildren(h("span", { class: "dot" }), "Ingen forbindelse – prøver igen");
    return;
  }
  document.body.classList.remove("stale");
  render(state);
}
let rt = 0;
addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(() => document.querySelectorAll(".chart").forEach((el) => el._draw && el._draw()), 120); });
tick();
setInterval(tick, 5000);
</script>
</body>
</html>
