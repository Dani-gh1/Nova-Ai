<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f7fb" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b0e14" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Nova AI">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/static/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
<title>Nova AI</title>
<style>
:root{
  --bg:#f4f5fa;--surface:#fff;--ink:#0d1220;--ink2:#4a5468;--mute:#8a94a8;--line:#e6e9f2;--soft:#eff2f8;
  --acc:#6d5cff;--acc2:#ec4899;--pos:#0e9f6e;--neg:#e5484d;--warn:#c27c0e;
  --shadow:0 1px 2px rgba(13,18,32,.04),0 10px 30px -14px rgba(13,18,32,.14);
  --r:20px;--grey:#c3cad8;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#07090f;--surface:#10141d;--ink:#f1f3f9;--ink2:#a9b2c4;--mute:#667085;--line:#1f2533;--soft:#171c28;
  --acc:#8f82ff;--acc2:#f472b6;--pos:#34d399;--neg:#ff6b70;--warn:#f0b357;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 16px 36px -18px rgba(0,0,0,.7);--grey:#343c4e}}
body{background-image:radial-gradient(1200px 500px at 85% -10%,color-mix(in srgb,var(--acc) 10%,transparent),transparent 70%),
  radial-gradient(900px 400px at -10% 0%,color-mix(in srgb,var(--acc2) 7%,transparent),transparent 70%);background-repeat:no-repeat}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  -webkit-font-smoothing:antialiased;min-height:100vh}
button,select,input{font:inherit;color:inherit}
button{touch-action:manipulation}
a{color:inherit}
.num{font-variant-numeric:tabular-nums}
.pos{color:var(--pos)}.neg{color:var(--neg)}.mute{color:var(--mute)}

/* ---------- top ---------- */
header{position:sticky;top:0;z-index:20;padding-top:env(safe-area-inset-top);background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:saturate(1.4) blur(14px);
  -webkit-backdrop-filter:saturate(1.4) blur(14px);border-bottom:1px solid var(--line)}
.bar{max-width:1120px;margin:0 auto;padding:0 max(20px,env(safe-area-inset-right)) 0 max(20px,env(safe-area-inset-left))}
.brand{display:flex;align-items:center;gap:12px;padding:14px 0 10px}
.logo{width:30px;height:30px;border-radius:9px;display:block;box-shadow:0 4px 12px -4px var(--acc)}
.brand b{font-size:16px;letter-spacing:-.01em}
.badge{margin-left:10px;font-size:11.5px;font-weight:600;color:var(--warn);background:color-mix(in srgb,var(--warn) 12%,transparent);border-radius:99px;padding:3px 10px;white-space:nowrap}
.scroller{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:12px}
.scroller::-webkit-scrollbar{display:none}
.pill{user-select:none;-webkit-user-select:none;flex:1 1 auto;border:0;background:transparent;color:var(--ink2);padding:7px 12px;border-radius:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;line-height:1.25;
  white-space:nowrap;transition:background .18s,color .18s,box-shadow .18s}
.pill:hover{background:var(--soft)}
.pill.home{margin-left:auto;flex:none;padding:6px 14px 6px 11px;border-radius:99px;background:var(--surface);box-shadow:0 0 0 1px var(--line);color:var(--ink);font-weight:600;font-size:14px}
.pill.home svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linejoin:round}
.pill.home[aria-selected=true]{background:var(--acc);color:#fff;box-shadow:0 6px 16px -8px var(--acc)}
.bothead{display:flex;align-items:center;gap:12px;margin:0 0 16px;flex-wrap:wrap}
.bothead a.back{color:var(--ink2);text-decoration:none;font-size:14px;border:1px solid var(--line);border-radius:99px;padding:5px 13px;background:var(--surface)}
.bothead a.back:hover{color:var(--ink);background:var(--soft)}
.bothead b{font-size:19px;letter-spacing:-.01em}.bothead small{color:var(--mute);font-size:14px}
.pill[aria-selected=true]{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:var(--shadow),0 0 0 1px var(--line)}
.pill .t{display:flex;flex-direction:column;align-items:flex-start;min-width:0}.pill small{color:var(--mute);font-weight:400;font-size:11.5px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--mute);flex:none}
.issue{font-size:12px;color:var(--mute);white-space:normal;max-width:380px;margin-top:3px;line-height:1.35}
.dot.warn{background:var(--warn);box-shadow:0 0 0 3px color-mix(in srgb,var(--warn) 22%,transparent)}
.dot.up{background:var(--pos);box-shadow:0 0 0 3px color-mix(in srgb,var(--pos) 18%,transparent)}.dot.down{background:var(--neg)}
.subbar{border-top:1px solid var(--line)}
.subs{display:flex;gap:4px}
.sub svg{display:none}
.sub{border:0;background:none;padding:11px 14px;color:var(--ink2);cursor:pointer;position:relative;transition:color .18s}
.sub:hover{color:var(--ink)}
.sub[aria-selected=true]{color:var(--ink);font-weight:600}
.sub[aria-selected=true]::after{content:"";position:absolute;left:12px;right:12px;bottom:-1px;height:2px;border-radius:2px;background:var(--acc)}
.pill:focus-visible,.sub:focus-visible,select:focus-visible,input:focus-visible,.seg button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}

/* ---------- indhold ---------- */
main{max-width:1120px;margin:0 auto;padding:22px 20px 60px}
.view{animation:in .28s ease both}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.view{animation:none}*{transition:none!important}}
.grid{display:grid;gap:16px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(200px,1fr));margin-bottom:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:20px;margin-bottom:16px}
.grid>.card{margin-bottom:0}
.kpi .l{font-size:12.5px;color:var(--ink2)}
.kpi .v{overflow-wrap:anywhere;font-size:24px;font-weight:650;letter-spacing:-.02em;margin-top:4px;line-height:1.2}
.kpi .s{font-size:12.5px;color:var(--mute);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
h2{font-size:15px;margin:0;letter-spacing:-.01em}
.head{display:flex;align-items:baseline;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.head p{margin:0;color:var(--mute);font-size:13px}
.note{font-size:12.5px;color:var(--mute);margin:4px 0 0}

/* tabeller */
.tw{overflow-x:auto;margin:0 -8px}
table{border-collapse:collapse;width:100%}
th{font-size:12px;font-weight:600;color:var(--mute);text-align:left;padding:8px 12px;white-space:nowrap;letter-spacing:.01em}
td{padding:11px 12px;border-top:1px solid var(--line);white-space:nowrap}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
tbody tr{transition:background .15s}
tbody tr:hover{background:var(--soft)}
td.name{white-space:normal;min-width:150px}
td.name .sw{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:9px}
td a{font-weight:600;text-decoration:none}td a:hover{color:var(--acc)}
.tag{font-size:11px;color:var(--ink2);background:var(--soft);border-radius:99px;padding:2px 8px;margin-left:8px}
.st{display:inline-flex;align-items:center;gap:8px}
.empty{padding:36px 12px;text-align:center;color:var(--mute)}
.under{display:none;font-size:12.5px;color:var(--mute);font-weight:400}

/* graf */
.chart{position:relative;width:100%;height:340px;touch-action:pan-y}
.chart svg{display:block;width:100%;height:100%;overflow:visible}
.chart .ln{fill:none;stroke-linejoin:round;stroke-linecap:round;transition:opacity .2s,stroke-width .2s}
.chart .ln.dim{opacity:.18}
.tip{position:absolute;pointer-events:none;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);
  padding:9px 12px;font-size:12.5px;min-width:150px;opacity:0;transition:opacity .12s;z-index:3}
.tip .t{color:var(--mute);margin-bottom:5px}
.tip .r{display:flex;align-items:center;gap:12px;justify-content:space-between;margin-top:3px}
.tip .r span{display:flex;align-items:center;gap:7px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.legend{display:flex;gap:6px 16px;flex-wrap:wrap;margin-top:12px;font-size:13px;color:var(--ink2)}
.legend span{display:inline-flex;align-items:center;gap:7px}
.legend i{width:10px;height:3px;border-radius:2px;display:inline-block}

/* strategikort */
.tools{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;align-items:center}
.tools input,.tools select{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:9px 14px;min-width:0}
.tools input{flex:1;min-width:180px}
.strat{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:16px}
.sc{margin:0!important;display:flex;flex-direction:column;gap:14px}
.sc .top{display:flex;align-items:flex-start;gap:12px}
.sc h3{margin:0;font-size:16px;letter-spacing:-.01em}
.sc .grp{font-size:11.5px;color:var(--ink2);background:var(--soft);border-radius:99px;padding:2px 9px;display:inline-block;margin-top:5px}
.sc .big{margin-left:auto;font-size:22px;font-weight:650;letter-spacing:-.02em}
.sc .desc{margin:0;color:var(--ink2);font-size:13.5px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;background:var(--soft);border-radius:12px;padding:10px 12px}
.stats div{min-width:0}.stats b{display:block;font-size:14px;font-variant-numeric:tabular-nums}.stats span{font-size:11.5px;color:var(--mute)}
.rules h4{margin:0 0 6px;font-size:12px;color:var(--mute);font-weight:600;letter-spacing:.02em;text-transform:uppercase}
.kvs{display:block}
.kv{display:flex;justify-content:space-between;gap:16px;padding:7px 0;border-top:1px solid var(--line);font-size:13.5px}
.kv:first-child{border-top:0}
.kv span{color:var(--ink2);min-width:0}.kv b{font-weight:500;text-align:right;font-variant-numeric:tabular-nums;overflow-wrap:anywhere;min-width:0}

/* desk */
.sections{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:16px;margin-bottom:16px}
.sections .card{margin:0}
.sections h2{margin-bottom:10px}

/* handler */
.seg{display:inline-flex;background:var(--soft);border-radius:12px;padding:3px}
.seg button{border:0;background:none;padding:7px 16px;border-radius:9px;cursor:pointer;color:var(--ink2);transition:background .15s,color .15s}
.seg button[aria-pressed=true]{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:0 1px 3px rgba(15,23,42,.1)}
.more{display:block;margin:14px auto 0;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:8px 18px;cursor:pointer}
.more:hover{background:var(--soft)}
.msg{max-width:480px;margin:12vh auto;text-align:center;color:var(--ink2)}
.msg h2{font-size:20px;margin-bottom:6px;color:var(--ink)}
code{background:var(--soft);border-radius:6px;padding:1px 6px;font-size:13px}
a.ext{font-size:13px;color:var(--ink2);text-decoration:none;border:1px solid var(--line);border-radius:99px;padding:5px 12px;background:var(--surface)}
a.ext:hover{color:var(--ink);background:var(--soft)}


@media (max-width:720px){
  main{padding:16px max(14px,env(safe-area-inset-right)) calc(88px + env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left))}
  .bar{padding:0 max(14px,env(safe-area-inset-right)) 0 max(14px,env(safe-area-inset-left))}.card{padding:16px}
  .brand{padding:10px 0 8px}.scroller{padding-bottom:10px;scroll-snap-type:x proximity}.pill{scroll-snap-align:start;padding:7px 11px}
  /* underfanerne som bundmenu, som i en rigtig app. En forælder med backdrop-filter ville fange den faste menu, så den fjernes her */
  header{backdrop-filter:none;-webkit-backdrop-filter:none;background:var(--bg)}
  .subbar{position:fixed;left:0;right:0;bottom:0;z-index:30;border:0;border-top:1px solid var(--line);
    background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:saturate(1.4) blur(16px);-webkit-backdrop-filter:saturate(1.4) blur(16px);
    padding-bottom:env(safe-area-inset-bottom)}
  .subbar .bar{padding:0}.subs{display:grid;grid-template-columns:repeat(4,1fr);gap:0;overflow:visible}
  .sub{display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 4px 8px;font-size:11px;color:var(--mute)}
  .sub svg{display:block;width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
  .sub[aria-selected=true]{color:var(--acc)}.sub[aria-selected=true]::after{display:none}
  .tools input,.tools select{font-size:16px}
  .badge{display:none}
  .pill{flex:none}
  .chart{height:260px}
  .hide-m{display:none}.under{display:block}
  .stats{grid-template-columns:repeat(2,1fr)}
  .strat,.sections{grid-template-columns:1fr}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.kpi.card{padding:14px}.kpi .v{font-size:19px}.kpi .l{font-size:12px}
  td,th{padding:10px 8px}
  td.name{min-width:120px}
}
[hidden]{display:none!important}
.brandlink{display:flex;align-items:center;gap:10px;color:inherit;text-decoration:none}
.hero{display:flex;align-items:center;gap:14px;margin:6px 0 18px}.hero img{width:64px;height:64px;filter:drop-shadow(0 6px 18px rgba(91,91,240,.35))}
.hero h1{font-size:30px;letter-spacing:-.02em;background:linear-gradient(90deg,var(--acc),#ec4899);-webkit-background-clip:text;background-clip:text;color:transparent}
.kpis.two{grid-template-columns:repeat(3,minmax(0,1fr))}@media (max-width:640px){.kpis.two{grid-template-columns:1fr}}
.kpi .down{font-size:12.5px;color:var(--neg);margin-top:6px;line-height:1.5}
td.swap{display:flex;flex-wrap:wrap;align-items:center;gap:10px}td.swap a.name{color:inherit}
td.swap .arrow{display:inline-flex;flex-direction:column;align-items:center;line-height:1;min-width:64px}
td.swap .arrow small{font-size:12px;font-weight:700;margin-bottom:2px}td.swap .arrow .line{font-size:20px;color:var(--mute)}
.graphbar{display:flex;justify-content:flex-end;margin-bottom:6px}.graphbar .seg button{padding:5px 11px;font-size:13px}
a.back{display:inline-block;margin-bottom:12px;color:var(--ink2);text-decoration:none;font-size:14px;border:1px solid var(--line);border-radius:99px;padding:5px 13px;background:var(--surface)}
.calhead{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:8px}.calhead p{grid-column:1/-1}
.calnav{border:1px solid var(--line);background:var(--surface);border-radius:99px;width:32px;height:32px;cursor:pointer;font-size:18px;color:var(--ink)}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.cal .dow{font-size:12px;color:var(--mute);text-align:center}
.cal .day{border:1px solid var(--line);border-radius:10px;padding:6px;min-height:52px;display:flex;flex-direction:column;justify-content:space-between}
.cal .day .d{font-size:11.5px;color:var(--mute)}.cal .day b{font-size:12.5px;text-align:right}
.cal .day.pos{background:color-mix(in srgb,var(--pos) 12%,transparent)}.cal .day.neg{background:color-mix(in srgb,var(--neg) 12%,transparent)}
.cal .day.pos b{color:var(--pos)}.cal .day.neg b{color:var(--neg)}
@media (max-width:640px){.cal .day b{font-size:10px}.cal .day{min-height:44px;padding:4px}}
/* ---------- nyt design: hero, markeder og kapløbet ---------- */
.hero{position:relative;overflow:hidden;display:block;margin:4px 0 16px;padding:22px 22px 20px;border-radius:24px;color:#fff;
  background:linear-gradient(135deg,#4f46e5 0%,#7c3aed 55%,#db2777 120%);box-shadow:0 18px 40px -20px #6d28d9}
.hero::after{content:"";position:absolute;right:-60px;top:-80px;width:260px;height:260px;border-radius:50%;background:rgba(255,255,255,.10)}
.hero .top{display:flex;align-items:center;gap:12px;position:relative}.hero img{width:40px;height:40px;filter:none}
.hero h1{margin:0;font-size:22px;color:#fff;background:none}.hero .live{margin-left:auto;font-size:12px;background:rgba(255,255,255,.16);border-radius:99px;padding:4px 10px}
.hero .big{position:relative;margin-top:16px;font-size:13px;opacity:.85}.hero .big b{display:block;font-size:34px;letter-spacing:-.03em;opacity:1;line-height:1.15}
.hero .row{position:relative;display:flex;gap:22px;flex-wrap:wrap;margin-top:14px;font-size:13px}.hero .row div{opacity:.9}.hero .row b{display:block;font-size:16px}
.mk{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.mk .m{border:1px solid var(--line);border-radius:14px;padding:11px 13px;background:var(--soft);min-width:0}
.mk .m .n{display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px}.mk .m .s{font-size:12px;color:var(--mute);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.race .rr{display:grid;grid-template-columns:22px 1fr auto;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}.race .rr:first-child{border-top:0}
.race .bar2{height:6px;border-radius:6px;background:var(--soft);margin-top:5px;overflow:hidden}.race .bar2 i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--acc),var(--acc2))}
.race .rk{font-weight:700;color:var(--mute);text-align:center}.race .held .rk{color:var(--acc)}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}.duo>.card{margin:0}@media (max-width:820px){.duo{grid-template-columns:1fr}}
.headrow{display:flex;flex-wrap:wrap;align-items:center;gap:10px}.headrow h2{margin-right:auto}.headrow p{flex-basis:100%}.headrow .seg button{padding:5px 11px;font-size:13px}
</style>
</head>
<body>
<header>
  <div class="bar">
    <div class="brand"><a href="#" class="brandlink"><img class="logo" src="/static/logo.svg" width="34" height="34" alt=""><b>Nova AI</b></a></div>
  </div>
</header>
<main id="main"></main>

<script>
"use strict";
const OV = "overblik";
const PALETTE = ["#5b5bf0", "#f59e0b", "#10b981", "#ec4899", "#0ea5e9", "#8b5cf6", "#ef4444", "#14b8a6"];
const $ = (id) => document.getElementById(id);
let RAW = null;
let BOTS = [], curKey = OV, DATA = null, lastJson = "", seq = 0, chartState = null;

/* ---------- små hjælpere ---------- */
function h(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === "class") e.className = v; else if (k.startsWith("on")) e[k] = v; else e.setAttribute(k, v === true ? "" : v);
  }
  for (const c of kids.flat()) if (c != null && c !== false) e.append(c.nodeType ? c : document.createTextNode(String(c)));
  return e;
}
function sv(tag, attrs, ...kids) {
  const e = document.createElementNS("http://www.w3.org/2000/svg", tag);
  for (const [k, v] of Object.entries(attrs || {})) e.setAttribute(k, v);
  e.append(...kids); return e;
}
const nf = (v, d = 2) => v.toLocaleString("da-DK", { minimumFractionDigits: d, maximumFractionDigits: d });
const pct = (v) => v == null ? "–" : (v > 0 ? "+" : v < 0 ? "−" : "") + nf(Math.abs(v)) + " %";
const tone = (v) => v > 0 ? "pos" : v < 0 ? "neg" : "mute";
const when = (t) => t ? new Date(t * 1000).toLocaleString("da-DK", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" }) : "–";
const bot = () => BOTS.find((b) => b.key === curKey);
const STALE = 20 * 60;       // sekunder uden scanning, før vi advarer
function ago(s) {
  if (s == null) return "ukendt";
  if (s < 45) return "lige nu";
  if (s < 3600) return `${Math.round(s / 60)} min. siden`;
  if (s < 86400) return `${Math.round(s / 3600)} t. siden`;
  return `${Math.round(s / 86400)} d. siden`;
}

/* Tæller: hvor længe botterne har samlet data. Elementer med data-since opdateres hvert sekund. */
function dur(sec) {

      kpi("Nova Bot", sm ? pct(sm.today_pct) : "–", sm ? (sm.following ? `i dag · følger ${sm.following}` : "i dag · venter på, at en strategi stiger") : "starter", sm && tone(sm.today_pct))),
    smartCard(sm),
    h("div", { class: "duo" }, raceCard(sm), marketsCard(conf, ok)),
    calendarCard(sm),
    allStrategiesCard(rows));
}

/* Kapløbet: de 5 strategier, der er steget mest i dag. Nova Bot følger altid nr. 1 (målt over de seneste 24 timer) */
function raceCard(sm) {
  const L = (sm && sm.leaders) || [], top = Math.max(...L.map((x) => Math.abs(x.gain)), 0.01);
  return h("div", { class: "card race" }, h("div", { class: "head" }, h("h2", {}, "Kapløbet, seneste 24 timer"), h("p", {}, "Nova Bot følger den førende")),
    L.length ? L.map((x, i) => h("div", { class: "rr" + (x.held ? " held" : "") }, h("span", { class: "rk" }, String(i + 1)),
      h("div", { style: "min-width:0" }, h("div", { style: "overflow:hidden;text-overflow:ellipsis;white-space:nowrap" }, x.name, h("span", { class: "mute" }, ` · ${x.bot_name}`), x.held ? h("span", { class: "tag" }, "følges") : null),
        h("div", { class: "bar2" }, h("i", { style: `width:${Math.max(3, Math.abs(x.gain) / top * 100)}%` }))),
      h("b", { class: "num " + tone(x.gain) }, pct(x.gain)))) : h("div", { class: "empty" }, "Ingen strategi er steget de seneste 24 timer."));
}
/* Markeder: status for hvert marked på ét blik */
function marketsCard(conf, ok) {
  return h("div", { class: "card" }, h("div", { class: "head" }, h("h2", {}, "Markeder"), h("p", {}, `${ok.length} af ${conf.length} kører`)),
    h("div", { class: "mk" }, conf.map((b) => { const good = ok.includes(b);
      return h("div", { class: "m", title: b.issue || "" }, h("div", { class: "n" }, h("span", { class: "dot " + (good ? "up" : b.up ? "warn" : "down") }), b.name),
        h("div", { class: "s" }, !b.up ? "kører ikke" + (b.issue ? " · " + b.issue : "") : b.idle ? b.idle : b.scan_age == null ? "venter på første scanning" : `scannede ${ago(b.scan_age)}`)); })));
}
/* Alle strategier i alle botter, bedste først. Top 20 vises; "Se alle" viser resten (huskes ved opdatering hvert 15. sekund). */
let showAllStrategies = false;
function allStrategiesCard(rows) {
  const all = rows.flatMap((b) => (b.strategies || []).map((s) => ({ ...s, bot: b })))
    .map((s) => ({ ...s, r: s.ret && s.ret[PERIOD] != null ? s.ret[PERIOD] : (PERIOD === "max" ? s.return_pct : null) }))
    .filter((s) => typeof s.r === "number")                                // alle strategier, også dem på 0 %
    .sort((x, y) => y.r - x.r);
  const list = showAllStrategies ? all : all.slice(0, 20);
  const more = all.length > 20 ? h("button", { class: "more", type: "button", onclick: () => { showAllStrategies = !showAllStrategies; load(true); } },
    showAllStrategies ? "Vis kun top 20" : `Se alle ${all.length} strategier`) : null;
  return h("div", { class: "card" }, h("div", { class: "head headrow" }, h("h2", {}, "Bedste strategier"), periodSeg(),
      h("p", {}, "Tryk på en strategi for at se dens handler, afkast og graf.")),
    all.length ? h("div", { class: "tw" }, h("table", {}, h("thead", {}, h("tr", {}, h("th", { class: "hide-m" }, "#"), h("th", {}, "Strategi"), h("th", {}, "Marked"),
        h("th", { class: "n" }, `Afkast (${({ "24t": "24 t", "7d": "7 d", "1m": "1 md", max: "max" })[PERIOD]})`), h("th", { class: "n" }, h("span", { class: "hide-m" }, "Lukkede handler"), h("span", { class: "under" }, "Handler")))),
      h("tbody", {}, list.map((s, i) => h("tr", {}, h("td", { class: "mute hide-m" }, String(i + 1)), h("td", { class: "name" }, h("a", { href: stratHref(s.bot.key, s.key ?? s.name) }, s.name)),
        h("td", { class: "mute" }, s.bot.name),
        h("td", { class: "n " + tone(s.r) }, pct(s.r)),
        h("td", { class: "n" }, String(s.trades), s.trades < 20 ? h("span", { class: "tag hide-m" }, "få") : null)))))) :
      h("div", { class: "empty" }, "Ingen strategier med afkast endnu."),
    more);
}

/* ---------- start ---------- */
let rz;
addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(() => { if (curKey !== OV && DATA) vStrategy(); }, 150); });
addEventListener("hashchange", route);
(async function init() {
  await refreshBots();
  route();
  setInterval(refreshBots, 60000);
  setInterval(() => load(false), 15000);
})();
</script>
