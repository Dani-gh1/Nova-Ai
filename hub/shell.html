<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050607">
<meta name="color-scheme" content="dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Nova AI">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/static/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
<title>Nova AI</title>
<style>
:root{
  --bg:#050607;--card:#0d1012;--card2:#13171b;--line:rgba(255,255,255,.07);--line2:rgba(255,255,255,.13);
  --ink:#f3f6f8;--ink2:#a2abb4;--mute:#65707a;
  --neon:#5cf0a2;--neon2:#2fd486;--neon-d:rgba(92,240,162,.12);
  --violet:#9d8cff;--violet-d:rgba(157,140,255,.14);--blue:#5aa9ff;--blue-d:rgba(90,169,255,.13);
  --neg:#ff6b78;--neg-d:rgba(255,107,120,.12);--warn:#f6c453;--r:24px;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Display","Inter","Segoe UI",Roboto,system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;background:var(--bg)}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font:15px/1.45 var(--font);-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(480px 340px at 85% -120px,rgba(157,140,255,.14),transparent 70%),radial-gradient(420px 300px at 0% -80px,rgba(92,240,162,.08),transparent 70%);
  background-repeat:no-repeat}
button,input{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation;background:none;border:0;padding:0}
a{color:inherit;text-decoration:none}
.num{font-variant-numeric:tabular-nums}
.pos{color:var(--neon)}.neg{color:var(--neg)}.mute{color:var(--mute)}.warn{color:var(--warn)}.vio{color:var(--violet)}.blu{color:var(--blue)}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--violet);outline-offset:2px;border-radius:10px}
.ic0 svg{width:22px;height:22px;display:block;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* ---------- ramme ---------- */
.app{max-width:540px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 12px) max(18px,env(safe-area-inset-right)) calc(112px + env(safe-area-inset-bottom)) max(18px,env(safe-area-inset-left))}
.app.full{padding-bottom:calc(36px + env(safe-area-inset-bottom))}
.view{animation:in .35s cubic-bezier(.2,.7,.2,1) both}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.top{display:flex;align-items:center;justify-content:space-between;min-height:48px;margin-bottom:16px;gap:12px}
.iconbtn{width:46px;height:46px;border-radius:50%;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;position:relative;color:var(--ink);flex:none}
.iconbtn .dot{position:absolute;top:10px;right:11px;width:9px;height:9px;border-radius:50%;background:var(--neg);box-shadow:0 0 0 2px var(--card)}
.logo svg{width:42px;height:42px;display:block;filter:drop-shadow(0 0 10px rgba(92,240,162,.45))}
.pillbtn{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:10px 16px;color:var(--ink2);font-size:14.5px}
h1.hello{font-size:34px;line-height:1.12;letter-spacing:-.03em;margin:0 0 6px;font-weight:750}
h1.title{font-size:30px;line-height:1.15;letter-spacing:-.03em;margin:0 0 4px;font-weight:750}
.sub{color:var(--ink2);margin:0 0 20px;font-size:16px}
.sh{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:26px 2px 12px}
.sh h2{font-size:20px;margin:0;letter-spacing:-.02em;font-weight:700}
.sh a,.sh button{color:var(--ink2);font-size:14px;display:inline-flex;align-items:center;gap:4px}
.sh .ic0 svg{width:16px;height:16px}

/* ---------- kort ---------- */
.card{background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:var(--r);padding:20px;margin-bottom:14px;position:relative;overflow:hidden}
.card.tight{padding:6px 18px}
.note{font-size:13px;color:var(--mute);margin:10px 0 0;line-height:1.45}
.empty{padding:26px 8px;text-align:center;color:var(--mute);font-size:14px}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;border-radius:99px;padding:4px 10px;background:var(--neon-d);color:var(--neon);white-space:nowrap}
.badge.grey{background:rgba(255,255,255,.06);color:var(--ink2)}.badge.warn{background:rgba(246,196,83,.12);color:var(--warn)}
.badge.vio{background:var(--violet-d);color:var(--violet)}.badge.blu{background:var(--blue-d);color:var(--blue)}.badge.neg{background:var(--neg-d);color:var(--neg)}
.live{width:8px;height:8px;border-radius:50%;background:var(--neon);display:inline-block;flex:none;box-shadow:0 0 0 0 rgba(92,240,162,.6);animation:pulse 2s infinite}
.live.off{background:var(--mute);animation:none}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(92,240,162,.55)}70%{box-shadow:0 0 0 8px rgba(92,240,162,0)}100%{box-shadow:0 0 0 0 rgba(92,240,162,0)}}

/* saldo-kortet */
.pf{padding:22px 22px 14px;box-shadow:0 24px 60px -30px rgba(157,140,255,.35)}
.pf::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;pointer-events:none;
  background:linear-gradient(135deg,rgba(157,140,255,.45),rgba(90,169,255,.15) 40%,rgba(92,240,162,.25));
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}
.pf .head{display:flex;align-items:center;justify-content:space-between;gap:10px;position:relative;z-index:2}
.pf .lbl{color:var(--ink2);font-size:15px}
.pf .big{position:relative;z-index:2;font-size:46px;font-weight:760;letter-spacing:-.04em;line-height:1.05;margin-top:10px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px;position:relative;z-index:2}
.stat{background:rgba(255,255,255,.035);border:1px solid var(--line);border-radius:16px;padding:11px 13px;min-width:0}
.stat .l{font-size:12.5px;color:var(--ink2);display:flex;align-items:center;gap:6px}
.stat .v{font-size:19px;font-weight:720;letter-spacing:-.02em;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat .s{font-size:12.5px;font-weight:600}
.pf .chart,.chart.h{height:150px;margin:8px -22px 0}
.per{display:flex;justify-content:space-between;gap:4px;margin-top:6px}
.per button{flex:1;color:var(--mute);font-weight:600;font-size:14px;padding:9px 0;border-radius:14px;position:relative}
.per button[aria-pressed=true]{color:var(--ink);background:rgba(157,140,255,.12)}
.per button[aria-pressed=true]::after{content:"";position:absolute;left:32%;right:32%;bottom:3px;height:2px;border-radius:2px;background:linear-gradient(90deg,var(--violet),var(--blue));box-shadow:0 0 8px var(--violet)}
.seg{display:inline-flex;background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:14px;padding:3px;flex:none}
.seg button{padding:6px 12px;border-radius:11px;color:var(--ink2);font-size:13px;font-weight:600}
.seg button[aria-pressed=true]{background:var(--violet-d);color:var(--ink)}

/* graf */
.chart{position:relative;width:100%;touch-action:pan-y}
.chart svg{display:block;width:100%;height:100%;overflow:visible}
.chart .ln{fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.chart .ln.up{filter:drop-shadow(0 0 6px rgba(92,240,162,.55))}.chart .ln.down{filter:drop-shadow(0 0 6px rgba(255,107,120,.45))}
.chart .ln.draw{stroke-dasharray:3000;stroke-dashoffset:3000;animation:draw 1.4s cubic-bezier(.3,.7,.2,1) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.chart .ring{animation:ring 2.2s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes ring{0%{opacity:.7;transform:scale(1)}100%{opacity:0;transform:scale(3.2)}}
.tip{position:absolute;top:0;pointer-events:none;background:rgba(13,16,18,.94);border:1px solid var(--line2);border-radius:12px;padding:7px 10px;font-size:12.5px;white-space:nowrap;opacity:0;transition:opacity .12s;z-index:3;color:var(--ink2)}
.tip b{display:block;font-size:14px;color:var(--ink)}

/* bot-status */
.botrow{display:flex;align-items:center;gap:14px;padding:16px 18px}
.botrow .av svg{width:56px;height:56px;display:block;filter:drop-shadow(0 0 12px rgba(157,140,255,.35))}
.botrow .t{flex:1;min-width:0}.botrow .t b{display:flex;align-items:center;gap:8px;font-size:17px}
.botrow .t small{display:block;color:var(--ink2);font-size:14px;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chev{color:var(--ink2)}

/* fordeling */
.dist{display:grid;grid-template-columns:130px 1fr;gap:18px;align-items:center}
.dist svg{width:130px;height:130px;display:block}
.legend{display:flex;flex-direction:column;gap:11px;min-width:0}
.legend div{display:flex;align-items:center;gap:10px;font-size:15px}
.legend i{width:11px;height:11px;border-radius:50%;flex:none}
.legend span{flex:1;color:var(--ink2);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.legend b{font-weight:600}

/* knapper */
.btn{width:100%;height:58px;border-radius:20px;background:linear-gradient(180deg,#76f6b3,#45e391);color:#03140b;font-weight:680;font-size:17px;
  display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:0 14px 34px -14px rgba(92,240,162,.7);transition:transform .12s}
.btn:active{transform:scale(.985)}.btn:disabled{opacity:.42;box-shadow:none;cursor:default;transform:none}
.btn.ghost{background:var(--card2);color:var(--ink);border:1px solid var(--line2);box-shadow:none}
.btns{display:grid;grid-template-columns:1fr auto;gap:10px;margin:4px 0 4px}.btns .ghost{width:auto;padding:0 24px}

/* lister */
.row{display:flex;align-items:center;gap:13px;padding:13px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.ic{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:var(--neon-d);color:var(--neon);flex:none}
.ic.neg{background:var(--neg-d);color:var(--neg)}.ic.grey{background:rgba(255,255,255,.05);color:var(--ink2)}
.ic.vio{background:var(--violet-d);color:var(--violet)}.ic.blu{background:var(--blue-d);color:var(--blue)}
.row .t{flex:1;min-width:0}.row .t b{display:flex;align-items:center;gap:8px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .t b>span:first-child{overflow:hidden;text-overflow:ellipsis}
.row .t small{display:block;color:var(--mute);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .v{text-align:right;font-weight:650;white-space:nowrap}.row .v small{display:block;color:var(--mute);font-weight:500;font-size:12px}
.rank{width:24px;text-align:center;font-weight:700;color:var(--mute);flex:none}
.bar2{height:5px;border-radius:5px;background:rgba(255,255,255,.06);margin-top:6px;overflow:hidden}
.bar2 i{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,var(--violet),var(--blue))}
.bar2 i.pos{background:linear-gradient(90deg,var(--neon2),var(--neon));box-shadow:0 0 10px rgba(92,240,162,.45)}
.dayhead{font-size:12.5px;color:var(--mute);font-weight:600;text-transform:uppercase;letter-spacing:.04em;margin:18px 4px 6px}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -18px 6px;padding:0 18px}
.chips::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line2);background:var(--card);border-radius:99px;padding:11px 17px;white-space:nowrap;color:var(--ink);font-weight:550;flex:none}
.chip[aria-pressed=true]{border-color:var(--violet);color:var(--ink);background:var(--violet-d);box-shadow:0 0 24px rgba(157,140,255,.25)}

/* nøgletal */
.kgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.kgrid.three{grid-template-columns:repeat(3,1fr)}
.k{background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:20px;padding:15px 16px;min-width:0}
.k .l{font-size:12.5px;color:var(--ink2)}.k .v{font-size:22px;font-weight:720;letter-spacing:-.02em;margin-top:3px;overflow-wrap:anywhere;line-height:1.2}
.k .s{font-size:12.5px;color:var(--mute);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hist{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.hist div{background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.hist small{display:block;color:var(--ink2);font-size:12px}.hist b{font-size:16px}

/* investeringer */
.now{display:flex;align-items:center;gap:14px}
.now .av svg{width:64px;height:64px;display:block;filter:drop-shadow(0 0 14px rgba(157,140,255,.4))}
.now .t{flex:1;min-width:0}.now small{color:var(--ink2);font-size:13px}.now b{display:block;font-size:20px;letter-spacing:-.02em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* bot-siden */
.bothero{text-align:center;padding:30px 20px 24px}
.bothero .av{width:132px;height:132px;margin:0 auto 14px;border-radius:50%;display:grid;place-items:center;position:relative;
  background:radial-gradient(circle,rgba(157,140,255,.2),transparent 66%)}
.bothero .av::before{content:"";position:absolute;inset:6px;border-radius:50%;border:1.5px solid rgba(157,140,255,.25);border-top-color:var(--violet);animation:spin 9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.bothero .av svg{width:92px;height:92px;display:block;filter:drop-shadow(0 0 16px rgba(157,140,255,.45))}
.bothero h2{margin:0;font-size:24px;letter-spacing:-.02em;display:flex;align-items:center;justify-content:center;gap:9px}
.bothero p{margin:6px 0 14px;color:var(--ink2)}
.bothero .badges{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.ctl{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 0 16px}
.ctl .btn{height:52px;font-size:16px}
.risk{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.risk button{border:1px solid var(--line2);border-radius:16px;padding:12px 6px;background:var(--card);color:var(--ink2);font-weight:600}
.risk button:disabled{opacity:.45;cursor:default}
.lbl2{color:var(--ink2);font-size:13.5px;margin-bottom:8px}
.lock{display:flex;gap:10px;align-items:flex-start;background:rgba(246,196,83,.07);border:1px solid rgba(246,196,83,.18);border-radius:16px;padding:12px 14px;font-size:13.5px;color:var(--ink2);margin-top:14px}
.lock .ic0{color:var(--warn);flex:none}.lock .ic0 svg{width:18px;height:18px}
.lock.ok{background:var(--violet-d);border-color:rgba(157,140,255,.25)}.lock.ok .ic0{color:var(--violet)}
.kv{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:13px 0;border-top:1px solid var(--line);font-size:14.5px}
.kv:first-child{border-top:0}.kv span{color:var(--ink2)}.kv b{font-weight:600;text-align:right}
a.kv:hover b,a.kv:hover span{color:var(--ink)}
.steps{counter-reset:s;margin:0;padding:0;list-style:none}
.steps li{counter-increment:s;display:flex;gap:12px;padding:12px 0;border-top:1px solid var(--line);font-size:14.5px;color:var(--ink2);min-width:0}
.steps li:first-child{border-top:0}
.steps li>span{min-width:0;flex:1}
.steps li::before{content:counter(s);width:26px;height:26px;border-radius:50%;background:var(--violet-d);color:var(--violet);font-weight:700;font-size:13px;display:grid;place-items:center;flex:none}
.steps b{color:var(--ink)}
code{background:rgba(255,255,255,.07);border-radius:8px;padding:2px 7px;font-size:13px;color:var(--ink)}
.copy{display:flex;align-items:center;gap:8px;margin-top:8px;background:#000;border:1px solid var(--line2);border-radius:12px;padding:10px 12px;font:13px ui-monospace,Menlo,monospace;color:var(--neon)}
.copy span{flex:1;min-width:0;overflow-x:auto;white-space:nowrap}.copy button{color:var(--ink2);flex:none}.copy .ic0 svg{width:18px;height:18px}

/* indsæt / hæv */
.hero{display:block;margin:-6px auto 4px;max-width:340px}
.hero svg{width:100%;height:auto;display:block}
.center{text-align:center}
.amounts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:20px 0 12px}
.amounts .chip{padding:12px 0;text-align:center;font-size:14px}
.amount{border:1px solid var(--line2);background:var(--card);border-radius:22px;padding:14px 20px 12px;display:block}
.amount small{color:var(--ink2);font-size:14px}
.amount div{display:flex;align-items:baseline;gap:10px}
.amount input{background:none;border:0;outline:none;font-size:34px;font-weight:720;letter-spacing:-.02em;width:100%;padding:0;min-width:0}
.amount span{color:var(--ink2);font-size:18px}
.amount p{margin:2px 0 0;color:var(--mute);font-size:12.5px}
.method{display:flex;align-items:center;gap:14px;border:1px solid var(--line);background:var(--card);border-radius:20px;padding:15px 16px;margin-bottom:10px;width:100%;text-align:left}
.method .t{flex:1;min-width:0}.method .t b{display:block;font-weight:600}.method .t small{color:var(--mute);font-size:12.5px}
.method .ck{width:24px;height:24px;border-radius:50%;border:1.5px solid var(--line2);display:grid;place-items:center;flex:none;color:#03140b}
.method .ck .ic0 svg{width:15px;height:15px;stroke-width:3}
.method[aria-pressed=true]{border-color:var(--neon);box-shadow:inset 0 0 0 1px var(--neon),0 0 28px rgba(92,240,162,.22)}
.method[aria-pressed=true] .ck{background:var(--neon);border-color:var(--neon)}
.method:disabled{opacity:.42;cursor:default}
.mi{width:44px;height:44px;border-radius:14px;background:rgba(255,255,255,.05);display:grid;place-items:center;color:var(--ink);flex:none}
.foot{display:flex;align-items:center;justify-content:center;gap:8px;color:var(--mute);font-size:13px;margin-top:16px;text-align:center}
.foot .ic0 svg{width:16px;height:16px}

/* profil */
.profile{display:flex;align-items:center;gap:14px}
.avatar{width:60px;height:60px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,var(--violet),var(--blue));color:#0a0b1a;font-weight:800;font-size:24px;flex:none;box-shadow:0 0 30px rgba(157,140,255,.35)}
.field{display:block;margin-top:14px}
.field small{color:var(--ink2);font-size:13px}
.field input{display:block;width:100%;margin-top:6px;background:#000;border:1px solid var(--line2);border-radius:14px;padding:13px 14px;font-size:16px;outline:none}
.field input:focus{border-color:var(--violet)}

/* kalender */
.calhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;gap:8px}
.calhead h2{margin:0;font-size:18px;text-transform:capitalize}
.calhead small{display:block;font-size:13px;text-align:center}
.calnav{width:38px;height:38px;border-radius:50%;border:1px solid var(--line2);color:var(--ink);font-size:18px;flex:none}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.cal .dow{font-size:11.5px;color:var(--mute);text-align:center;padding-bottom:2px}
.cal .day{border-radius:12px;padding:6px 4px;min-height:54px;display:flex;flex-direction:column;justify-content:space-between;background:rgba(255,255,255,.025);min-width:0;border:1px solid transparent;text-align:left}
.cal .day .d{font-size:11.5px;color:var(--ink2)}.cal .day b{font-size:10px;text-align:right;font-weight:650;overflow:hidden}
.cal .day.pos{background:rgba(92,240,162,.12)}.cal .day.neg{background:rgba(255,107,120,.11)}
.cal .day.pos b{color:var(--neon)}.cal .day.neg b{color:var(--neg)}
.cal .day.today{border-color:rgba(90,169,255,.5)}
.cal .day[aria-pressed=true]{border-color:var(--violet);box-shadow:0 0 0 1px var(--violet),0 0 18px rgba(157,140,255,.35)}
.cal button.day:disabled{cursor:default}

/* skelet */
.sk{border-radius:var(--r);background:linear-gradient(90deg,var(--card) 0%,var(--card2) 50%,var(--card) 100%);background-size:200% 100%;animation:sk 1.4s infinite;margin-bottom:14px}
@keyframes sk{to{background-position:-200% 0}}

/* bundmenu */
.tabbar{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:540px;display:grid;grid-template-columns:repeat(5,1fr);

    li("Vælg ", h("b", {}, "Konverter"), " på Binance, og køb USDT eller USDC for pengene. Det er dem, botten handler med."),
    li("Indbetalingen vises her automatisk inden for et minut. Findes SEPA ikke for dig, så brug Krypto fra Revolut.")];
  if (dep) return [
    li("Binance: ", h("b", {}, "Wallet → Indbetal krypto → USDC"), ". Vælg et netværk (fx Polygon eller Solana), og kopiér adressen."),
    li("Revolut: køb ", h("b", {}, `USDC for ${nf(kr, 0)} kr.`), ` (≈ ${nf(usd, 2)} USD).`),
    li("Tryk ", h("b", {}, "Send"), ", indsæt Binance-adressen, og vælg ", h("b", {}, "samme netværk"), ". Et forkert netværk betyder tabte penge."),
    li("Send først ", h("b", {}, "5–10 USD som test"), ", og vent, til de står på Binance."),
    li("Indbetalingen vises her automatisk, når Binance har modtaget den.")];
  const first = liveOn ? li("Botten sælger først. Kør på serveren:", copyBox(`python3 -m hub kasse udbetal ${Math.round(kr)}`))
    : li("Rigtige penge er slået fra, så pengene står allerede som kontanter på Binance.");
  if (method === "bank") return [first,
    li("Binance: ", h("b", {}, "Konverter"), ` USDT/USDC til ${nf(eur, 2)} EUR.`),
    li("Binance: ", h("b", {}, "Wallet → Hæv → EUR → Bankoverførsel (SEPA)"), " til en konto i dit eget navn."),
    li("Pengene er normalt fremme inden for 1–2 bankdage.")];
  return [first,
    li("Revolut: ", h("b", {}, "Krypto → USDC → Modtag"), ". Kopiér adressen, og se hvilket netværk den bruger."),
    li("Binance: ", h("b", {}, "Wallet → Hæv → USDC"), `. Indsæt adressen, vælg samme netværk, og hæv ${nf(usd, 2)} USD.`),
    li("Hæv først ", h("b", {}, "et lille beløb som test"), ".")];
}

/* ---------- STRATEGI-SIDE ---------- */
function vStrategy() {
  const b = (DATA.rows || []).find((x) => x.key === R.a) || { name: R.a };
  if (!STRAT) return view(backbar(), h("div", { class: "sk", style: "height:120px" }), h("div", { class: "sk", style: "height:260px" }));
  const s = (STRAT.strategies || []).find((x) => String(x.key) === R.b || x.name === R.b);
  if (!s) return view(backbar(), h("div", { class: "card center" }, h("h2", { style: "margin:0" }, "Strategien findes ikke"), h("p", { class: "note" }, "Den er måske omdøbt eller fjernet.")));
  const o = (b.strategies || []).find((x) => String(x.key) === String(s.key) || x.name === s.name) || {};
  const cv = (s.curve || []).filter((p) => p.length >= 2).map((p) => [p[0], p[1]]), w = inPeriod(cv), sec = per()[2];
  const r = w.length > 1 && 100 + w[0][1] > 0 ? ((100 + w[w.length - 1][1]) / (100 + w[0][1]) - 1) * 100 : null, shown = Number.isFinite(sec) ? r : s.return_pct;
  const from = Number.isFinite(sec) ? Date.now() / 1000 - sec : 0, mine = (t) => t.strategy === s.name || t.strategy === String(s.key);
  const open = ((STRAT.trades || {}).open || []).filter(mine), closed = ((STRAT.trades || {}).closed || []).filter((t) => mine(t) && t.ts >= from);
  const ret = o.ret || {};
  view(backbar(h("span", { class: "badge grey" }, b.name)),
    h("h1", { class: "title" }, s.name), h("p", { class: "sub" }, s.description || b.name),
    h("div", { class: "card pf" }, h("div", { class: "head" }, h("span", { class: "lbl" }, "Afkast " + per()[4])),
      h("div", { class: "big num " + tone(shown) }, pct(shown)),
      chartBox("", w, (v) => pct(v)), periodTabs()),
    section("Historiske resultater", null, h("div", { class: "card" }, h("div", { class: "hist" },
      PERIODS.map(([, t, , k]) => { const v = ret[k] != null ? ret[k] : (k === "max" ? s.return_pct : null);
        return h("div", {}, h("small", {}, t), h("b", { class: "num " + tone(v) }, pct(v))); })))),
    h("div", { class: "kgrid" }, kpi("I alt", pct(s.return_pct), "siden strategien startede", tone(s.return_pct)),
      kpi("Vundet", s.win_rate == null ? "–" : nf(s.win_rate, 0) + " %", `${s.trades ?? 0} lukkede i alt`),
      kpi("Åbne nu", String(open.length), "positioner"), kpi("Handler", String(closed.length), per()[4])),
    section("Handler", null, h("div", { class: "card tight" }, open.length + closed.length ?
      [...open.map((t) => ({ ...t, isOpen: true })), ...closed].sort((a, z) => z.ts - a.ts).slice(0, 60).map((t) => h("div", { class: "row" },
        h("span", { class: "ic " + (t.isOpen ? "blu" : t.result_pct < 0 ? "neg" : "") }, icon(t.isOpen ? "clock" : t.result_pct < 0 ? "down" : "up")),
        h("div", { class: "t" }, h("b", {}, String(t.symbol)), h("small", {}, `${when(t.ts)}${t.side ? " · " + t.side : ""}${t.isOpen ? " · åben" : ""}`)),
        h("div", { class: "v num " + tone(t.result_pct) }, t.result_pct == null ? "–" : pct(t.result_pct)))) :
      h("div", { class: "empty" }, "Ingen handler i perioden."))),
    (s.rules || []).length ? section("Regler", null, h("div", { class: "card tight" }, s.rules.map(([a, z]) => h("div", { class: "kv" }, h("span", {}, a), h("b", {}, z))))) : null);
}

const VIEWS = { hjem: vHome, investeringer: vInvest, strategier: vStrategies, kalender: vCalendar, profil: vProfile,
  historik: vHistory, bot: vBot, indsaet: vFlow, udbetal: vFlow, s: vStrategy };
